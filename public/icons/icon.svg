<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2e24"/>
      <stop offset="1" stop-color="#0e1813"/>
    </linearGradient>
    <!-- one leaf, turning: green at the stem to red at the tip -->
    <linearGradient id="turn" x1="0.2" y1="1" x2="0.8" y2="0">
      <stop offset="0.08" stop-color="#5aa83c"/>
      <stop offset="0.34" stop-color="#c9c23a"/>
      <stop offset="0.52" stop-color="#f2b130"/>
      <stop offset="0.72" stop-color="#ea6a22"/>
      <stop offset="0.94" stop-color="#c72a24"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- distant ridgelines, banded by elevation -->
  <path d="M0 404 L90 330 L150 372 L240 290 L330 360 L410 300 L512 380 V512 H0 Z" fill="#26402f"/>
  <path d="M0 452 L110 392 L210 440 L320 384 L420 430 L512 400 V512 H0 Z" fill="#2f5038"/>
  <!-- the aspen leaf -->
  <g transform="rotate(-24 256 250)">
    <path d="M256 86 C 330 120 386 190 380 262 C 374 332 318 368 256 368 C 194 368 138 332 132 262 C 126 190 182 120 256 86 Z" fill="url(#turn)" stroke="#2a1608" stroke-width="9" stroke-linejoin="round"/>
    <g stroke="#3a1f0a" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M256 368 L256 112"/>
      <path d="M256 300 L184 256 M256 300 L328 256"/>
      <path d="M256 236 L196 190 M256 236 L316 190"/>
      <path d="M256 176 L222 148 M256 176 L290 148"/>
    </g>
    <path d="M256 366 C 256 400 248 424 232 446" fill="none" stroke="#2a1608" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- small falling leaves -->
  <path d="M416 120 c 18 6 26 22 20 36 c -16 2 -30 -10 -20 -36 Z" fill="#ea6a22"/>
  <path d="M86 172 c -14 10 -16 28 -6 38 c 14 -6 20 -22 6 -38 Z" fill="#f2b130"/>
</svg>
